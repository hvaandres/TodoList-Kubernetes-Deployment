# Filebeat managed by the ECK operator. Runs as a DaemonSet, tails the
# container logs of the pods on its node, enriches them with Kubernetes
# metadata, and ships them straight to Elasticsearch (no Logstash).
#
# - Todo app container (default namespace, container `todo-list`): the app
#   writes ECS JSON, one object per line, which is decoded into fields.
# - Every other container: shipped as plain log lines with metadata.
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: elk
spec:
  type: filebeat
  version: 9.4.4
  elasticsearchRef:
    name: elasticsearch
  config:
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: false
          templates:
            # Todo app: decode the ECS JSON lines.
            - condition:
                and:
                  - equals:
                      kubernetes.namespace: default
                  - equals:
                      kubernetes.container.name: todo-list
              config:
                - type: filestream
                  id: todo-list-${data.kubernetes.container.id}
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  prospector.scanner.symlinks: true
                  parsers:
                    - container:
                        format: auto
                        stream: all
                    - ndjson:
                        target: ""
                        overwrite_keys: true
                        expand_keys: true
                        add_error_key: true
            # Everything else: plain container logs.
            - condition:
                not:
                  and:
                    - equals:
                        kubernetes.namespace: default
                    - equals:
                        kubernetes.container.name: todo-list
              config:
                - type: filestream
                  id: container-${data.kubernetes.container.id}
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  prospector.scanner.symlinks: true
                  parsers:
                    - container:
                        format: auto
                        stream: all
    # Single-node cluster: no replicas, otherwise indices stay yellow.
    setup.template.settings:
      index.number_of_replicas: 0
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsUser: 0
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 100m
                memory: 150Mi
              limits:
                cpu: 500m
                memory: 400Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: elk
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: elk
roleRef:
  kind: ClusterRole
  name: filebeat
  apiGroup: rbac.authorization.k8s.io
