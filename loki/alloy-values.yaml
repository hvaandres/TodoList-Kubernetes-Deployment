# Helm values for the Grafana Alloy chart (grafana/alloy).
# Alloy replaces Promtail (deprecated) as the log collector. It runs as a
# DaemonSet, tails the logs of the pods on its own node through the Kubernetes
# API, and pushes them to Loki.
# Install with: ./install.sh

controller:
  type: daemonset

alloy:
  # Used by the configuration below to only collect pods on this node.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

  configMap:
    create: true
    content: |
      // Discover pods running on this node.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("NODE_NAME"), "")
        }
      }

      // Turn Kubernetes metadata into low-cardinality Loki labels.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          target_label  = "instance"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // The Todo app writes one JSON object per line. Promote the log level
        // to a label (low cardinality) so it can be filtered and graphed.
        // Everything else stays in the log line and is parsed at query time.
        stage.match {
          selector = "{namespace=\"default\", app=\"todo-list\"}"

          stage.json {
            expressions = { level = "level" }
          }
          stage.labels {
            values = { level = "" }
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
