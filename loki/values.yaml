# Helm values for the Loki chart (grafana-community/loki).
# Minimal single-binary install suited to Minikube: filesystem storage, one
# replica, no auth, no caches, no gateway. Not intended for production.
# Install with: ./install.sh

deploymentMode: SingleBinary

loki:
  # Single-tenant: no X-Scope-OrgID header needed by Alloy or Grafana.
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    # Keep the Minikube volume small: drop logs older than 7 days.
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Unused components for a single-binary deployment.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

gateway:
  enabled: false
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Loki's own metrics are scraped by the existing Prometheus via annotations.
monitoring:
  selfMonitoring:
    enabled: false
  serviceMonitor:
    enabled: false
